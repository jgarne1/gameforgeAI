<!doctype html><meta charset="utf-8"><title>Integrated bridge QA</title><style>body{background:#253a40;color:white;font:16px sans-serif}canvas{border:1px solid #bdc}button{padding:8px}</style><h1>Integrated bridge v2</h1><p>One original: continuous paving, both ramps, baked parapet/rim. Green: measured inset walkable floor. Orange: centerline.</p><button id="mask">Toggle geometry</button><canvas width="1200" height="740"></canvas><script>
let d,im=new Image,tm=new Image,overlay=true;const c=document.querySelector('canvas'),x=c.getContext('2d');fetch('metadata.json').then(r=>r.json()).then(q=>{d=q;im.onload=draw;tm.onload=draw;im.src='bridge_source.png';tm.src='shore_threshold_source.png'});function draw(){if(!d)return;let f=d.assets[0],s=f.sourceRect,k=.5,w=f.displaySize.w*k,h=f.displaySize.h*k;['#dae3cd','#1d3c47'].forEach((bg,i)=>{let ax=600,ay=185+i*360;x.fillStyle=bg;x.fillRect(0,i*360,1200,360);x.drawImage(im,s.x,s.y,s.w,s.h,ax-f.placeOrigin.x*w,ay-f.placeOrigin.y*h,w,h);if(tm.complete&&tm.naturalWidth&&d.assets[1]){let t=d.assets[1],r=t.sourceRect,tw=t.displaySize.w*k,th=t.displaySize.h*k;for(let side of ['east','west']){let p=d.thresholdAssembly[side+'PositionLocal'];x.save();x.translate(ax+p[0]*k,ay+p[1]*k);if(side==='west')x.scale(-1,1);x.drawImage(tm,r.x,r.y,r.w,r.h,-t.placeOrigin.x*tw,-t.placeOrigin.y*th,tw,th);x.restore()}}if(overlay){let p=d.assembly.floorPolygonLocal;x.beginPath();p.forEach(([a,b],j)=>j?x.lineTo(ax+a*k,ay+b*k):x.moveTo(ax+a*k,ay+b*k));x.closePath();x.fillStyle='#40e89033';x.fill();x.strokeStyle='#16773e';x.stroke();x.beginPath();d.assembly.centerlineLocal.forEach(([a,b],j)=>j?x.lineTo(ax+a*k,ay+b*k):x.moveTo(ax+a*k,ay+b*k));x.strokeStyle='#da841c';x.stroke();for(let [a,b] of d.assembly.centerlineLocal){x.beginPath();x.ellipse(ax+a*k,ay+b*k,12,6,0,0,Math.PI*2);x.fillStyle='#933a27';x.fill()}}})}document.querySelector('#mask').onclick=()=>{overlay=!overlay;draw()};
</script>
