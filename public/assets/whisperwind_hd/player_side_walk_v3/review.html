<!doctype html><meta charset="utf-8"><title>Main player side walk QA</title><style>body{background:#263a40;color:white;font:16px sans-serif}canvas{background:#233e34;border:1px solid #abc;image-rendering:pixelated}button{padding:8px}</style><h1>Main player side walk candidate</h1><p>Fixed sole line. Uniform source scale by head landmarks. Contact A / passing A / contact B / passing B.</p><button id="play">Pause</button><button id="next">Next pose</button><canvas width="1200" height="500"></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let data,imgs={},n=0,play=true;
fetch('metadata_candidate.json').then(r=>r.json()).then(async d=>{data=d;await Promise.all(Object.values(d.directions).flat().map(f=>new Promise(ok=>{if(imgs[f.file])return ok();let im=new Image;imgs[f.file]=im;im.onload=ok;im.src=f.file})));draw()});
function draw(){if(!data)return;x.clearRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;Object.entries(data.directions).forEach(([dir,fs],i)=>{let f=fs[n%fs.length],s=f.sourceRect,z=3,w=f.displaySize.w*z,h=f.displaySize.h*z,ax=300+i*600,ay=340;x.strokeStyle='#e1ba72';x.beginPath();x.moveTo(ax-200,ay);x.lineTo(ax+200,ay);x.stroke();x.drawImage(imgs[f.file],s.x,s.y,s.w,s.h,ax-f.placeOrigin.x*w,ay-f.placeOrigin.y*h,w,h);x.fillStyle='white';x.fillText(dir+' '+f.pose,ax-210,390);});}setInterval(()=>{if(play){n++;draw()}},180);document.querySelector('#play').onclick=()=>play=!play;document.querySelector('#next').onclick=()=>{play=false;n++;draw()};
</script>
