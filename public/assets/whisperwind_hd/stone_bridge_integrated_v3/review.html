<!doctype html><meta charset="utf-8"><title>Integrated bridge v3 QA</title><style>body{background:#253a40;color:white;font:16px sans-serif}canvas{border:1px solid #bdc}button{padding:8px}</style><h1>Integrated bridge v3</h1><p>Both warm-cobble shore toes are baked into one source. No external threshold. Green: inset floor; orange: route centerline.</p><button id="mask">Toggle geometry</button><canvas width="1200" height="740"></canvas><script>let d,im=new Image,overlay=true;const c=document.querySelector('canvas'),x=c.getContext('2d');fetch('metadata.json').then(r=>r.json()).then(q=>{d=q;im.onload=draw;im.src='bridge_source.png'});function draw(){if(!d)return;let f=d.assets[0],s=f.sourceRect,k=.5,w=f.displaySize.w*k,h=f.displaySize.h*k;['#dce4ce','#193846'].forEach((bg,i)=>{let ax=600,ay=185+i*360;x.fillStyle=bg;x.fillRect(0,i*360,1200,360);x.drawImage(im,s.x,s.y,s.w,s.h,ax-f.placeOrigin.x*w,ay-f.placeOrigin.y*h,w,h);if(overlay){let p=d.assembly.floorPolygonLocal;x.beginPath();p.forEach(([a,b],j)=>j?x.lineTo(ax+a*k,ay+b*k):x.moveTo(ax+a*k,ay+b*k));x.closePath();x.fillStyle='#40e89033';x.fill();x.strokeStyle='#16773e';x.stroke();x.beginPath();d.assembly.centerlineLocal.forEach(([a,b],j)=>j?x.lineTo(ax+a*k,ay+b*k):x.moveTo(ax+a*k,ay+b*k));x.strokeStyle='#da841c';x.stroke();for(let [a,b] of d.assembly.centerlineLocal){x.beginPath();x.ellipse(ax+a*k,ay+b*k,12,6,0,0,Math.PI*2);x.fillStyle='#933a27';x.fill()}}})}document.querySelector('#mask').onclick=()=>{overlay=!overlay;draw()};</script>
