<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameForge Estate</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03110b;font-family:Arial,Helvetica,sans-serif;color:#eafff4}
  .boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(34,197,94,.20),rgba(3,7,18,.96));z-index:1;text-align:center;padding:24px}
  .boot h1{margin:0 0 8px;font-size:28px}.boot p{margin:0;color:#b7f7cf;font-weight:800}
</style>
</head>
<body>
<div class="boot" id="boot"><div><h1>Estate District</h1><p>Opening the neighborhood gate...</p></div></div>
<script src="/games/js/world_engine.js"></script>
<script>
var GAME_CONTEXT=null;
function playerName(){
  try{
    if(GAME_CONTEXT&&GAME_CONTEXT.username)return GAME_CONTEXT.username;
    if(window.GAME_PLAYERS&&window.GAME_PLAYERS.length)return window.GAME_PLAYERS[0].name||'guest';
    return localStorage.getItem('gf_user')||'guest';
  }catch(e){return 'guest';}
}
function startEstate(){
  var boot=document.getElementById('boot');
  if(boot)boot.style.display='none';
  if(!window.PetWorldWorldEngine){alert('RPG scene engine did not load.');return;}
  var params=new URLSearchParams(location.search);
  var scene=params.get('scene')||'whisperwind_village';
  PetWorldWorldEngine.start({username:playerName(),sceneId:scene,onClose:function(){
    if(window.parent&&window.parent!==window){window.parent.postMessage({type:'gameExitRequested',gameId:'estate'},'*');}
  }});
}
window.addEventListener('message',function(ev){
  var m=ev.data||{};
  if(m.type==='GAME_CONTEXT'){GAME_CONTEXT=m.data||GAME_CONTEXT;try{localStorage.setItem('gf_user',GAME_CONTEXT.username||'guest');}catch(e){} }
  if(m.type==='gameSetup'&&m.username){GAME_CONTEXT=GAME_CONTEXT||{};GAME_CONTEXT.username=m.username;try{localStorage.setItem('gf_user',m.username||'guest');}catch(e){} }
});
setTimeout(startEstate,80);
</script>
</body>
</html>
