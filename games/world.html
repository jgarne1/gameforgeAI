<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Forger</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060b13;color:#eaf6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#143a31,#050910 70%);z-index:20;text-align:center}#boot h1{margin:0 0 8px;font-family:Georgia,serif;color:#f6e7b2}.muted{color:#a9c5c8;font-weight:700}</style></head><body><div id="boot"><div><h1>World Forger</h1><div class="muted">Loading Whisperwind v2 hub…</div></div></div><script src="/games/js/world_engine.js?v=wfv2hub"></script><script>function gfUser(){try{return localStorage.getItem('gf_user')||'Wanderer'}catch(e){return 'Wanderer'}}window.addEventListener('message',function(ev){var m=ev.data||{};if(m.type==='GAME_CONTEXT'&&m.data&&m.data.username){try{localStorage.setItem('gf_user',m.data.username)}catch(e){}}});setTimeout(function(){var boot=document.getElementById('boot');if(boot)boot.remove();var scene=new URLSearchParams(location.search).get('scene')||'whisperwind_v2_hub';if(!window.WorldForgerEngine){document.body.innerHTML='<div style="padding:32px">World engine failed to load.</div>';return;}WorldForgerEngine.start({sceneId:scene,username:gfUser(),onClose:function(){if(parent&&parent!==window)parent.postMessage({type:'gameExitRequested',gameId:'world'},'*');else location.href='/';}});},80);</script></body></html>
