<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Forger - Whisperwind Town</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111e;font-family:Inter,Arial,Helvetica,sans-serif;color:#e8f7ff}
  .boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(46,164,255,.2),rgba(6,17,30,.96));z-index:5;text-align:center;padding:24px}
  .boot h1{margin:0 0 8px;font-size:30px}.boot p{margin:0;color:#a8d7f2;font-weight:700}
</style>
</head>
<body>
<div class="boot" id="boot"><div><h1>World Forger</h1><p>Loading Whisperwind Village...</p></div></div>
<script src="/games/js/world_engine.js"></script>
<script>
var GAME_CONTEXT=null;
function playerName(){
  try{
    if(GAME_CONTEXT&&GAME_CONTEXT.username)return GAME_CONTEXT.username;
    if(window.GAME_PLAYERS&&window.GAME_PLAYERS.length)return window.GAME_PLAYERS[0].name||'guest';
    return localStorage.getItem('gf_user')||'guest';
  }catch(e){return 'guest';}
}
function startWorld(){
  var boot=document.getElementById('boot');
  if(boot)boot.style.display='none';
  if(!window.PetWorldWorldEngine){alert('World engine did not load.');return;}
  var params=new URLSearchParams(location.search);
  var scene=params.get('scene')||'whisperwind_village';
  window.PetWorldWorldEngine.start({username:playerName(),sceneId:scene,onClose:function(){
    if(window.parent&&window.parent!==window)window.parent.postMessage({type:'gameExitRequested',gameId:'world'},'*');
  }});
}
window.addEventListener('message',function(ev){
  var m=ev.data||{};
  if(m.type==='GAME_CONTEXT'){GAME_CONTEXT=m.data||GAME_CONTEXT;try{localStorage.setItem('gf_user',GAME_CONTEXT.username||'guest');}catch(e){}}
  if(m.type==='gameSetup'&&m.username){GAME_CONTEXT=GAME_CONTEXT||{};GAME_CONTEXT.username=m.username;try{localStorage.setItem('gf_user',m.username||'guest');}catch(e){}}
});
setTimeout(startWorld,80);
</script>
</body>
</html>
