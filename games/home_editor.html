<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decorate Your Home</title><style>
*{box-sizing:border-box}body{margin:0;background:#101e1a;color:#f8eed4;font:16px system-ui}header{padding:16px 24px;background:#182e25;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font:26px Georgia;margin:0}main{display:grid;grid-template-columns:minmax(420px,1fr) 330px;gap:18px;padding:18px;max-width:1500px;margin:auto}canvas{width:100%;background:#362c24;border:2px solid #b8a17b;border-radius:12px;touch-action:none}aside{background:#1b3028;padding:20px;border-radius:12px;max-height:calc(100vh - 110px);overflow:auto}button,a{background:#304b3d;color:#fff0c4;border:1px solid #a8976b;border-radius:7px;padding:9px 12px;cursor:pointer;text-decoration:none}button:hover{background:#41674f}label{display:block;margin:13px 0}select,input{width:100%;padding:9px;background:#102219;color:#fff0ce;border:1px solid #758c78;border-radius:6px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette button{font-size:13px}.muted{color:#c1d3c1;font-size:14px}#status{min-height:24px}#placed{height:115px} @media(max-width:800px){main{grid-template-columns:1fr}aside{max-height:none}}
</style></head><body><header><h1>Make Yourself at Home</h1><button id="save">Save Home</button><a id="return">Return to Home</a><span id="status" role="status"></span></header><main><section><canvas id="room" width="1200" height="900" aria-label="Home decoration preview"></canvas><p class="muted">Add furnishings, then drag them around the room. Select a placed item to rotate, resize, or remove it. The shaded entrance stays clear. Changes are saved only when you press Save Home.</p></section><aside><h2>Furnishings</h2><div class="palette" id="palette"></div><label>Placed items<select id="placed" size="5"></select></label><label>Rotation<select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><label>Size<input id="scale" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><button id="remove">Remove Selected</button><h2>Room and Exterior</h2><canvas id="exteriorPreview" width="400" height="380" aria-label="Exterior and roof preview"></canvas><p id="homeKind" class="muted"></p><label>Floor<select id="floor"><option value="oak">Warm oak</option><option value="walnut">Dark walnut</option><option value="stone">Stone</option></select></label><label>Walls<select id="wall"><option value="cream">Cream</option><option value="sage">Sage</option><option value="blue">Blue</option><option value="rose">Rose</option></select></label><label>Exterior<select id="style"><option value="cottage">Garden cottage</option><option value="apartment">Lantern apartment</option><option value="shop">Market house</option></select></label><label>Welcome sign accent<select id="accent"><option value="sage">Sage</option><option value="blue">Blue</option><option value="rose">Rose</option><option value="gold">Gold</option></select></label><label>Roof color<select id="roof"><option value="original">Original terracotta</option><option value="slate">River blue slate</option><option value="moss">Moss green</option><option value="plum">Heather plum</option></select></label><label>Welcome sign<input id="sign" maxlength="32" placeholder="A name for your home"></label><label>Visitors<select id="privacy"><option value="public">Visitors may enter</option><option value="private">Only I may enter</option></select></label></aside></main>
<script src="/games/js/whisperwind_assets.js"></script><script>
'use strict';const $=id=>document.getElementById(id),plot=new URLSearchParams(location.search).get('plot');let decoration,assets={},images={},selected=-1,drag=null;
const labels={wwhd_bed:'Bed',wwhd_sofa:'Sofa',wwhd_bookcase:'Bookcase',wwhd_plant:'Fern',wwhd_desk:'Writing desk',wwhd_chair:'Chair',wwhd_table:'Dining table',wwhd_rug:'Rug',wwhd_bar:'Counter',wwhd_fireplace:'Fireplace',wwhd_home_sofa:'Sofa',wwhd_home_armchair:'Armchair',wwhd_home_dining_table:'Dining Table',wwhd_home_dining_chair:'Dining Chair',wwhd_home_bed:'Bed',wwhd_home_bookcase:'Bookcase',wwhd_home_dresser:'Dresser',wwhd_home_bedside:'Bedside',wwhd_home_plant:'Plant',wwhd_home_floor_lamp:'Floor Lamp',wwhd_home_rug:'Rug',wwhd_home_aquarium:'Aquarium',wwhd_home_wardrobe:'Wardrobe'};
async function json(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Could not load home.');return d;}
function list(){const el=$('placed');el.replaceChildren();decoration.objects.forEach((o,i)=>{const option=document.createElement('option');option.value=i;option.textContent=(i+1)+'. '+labels[o.asset];el.append(option);});el.value=selected;if(selected>=0){$('rotation').value=decoration.objects[selected].rotation||0;$('scale').value=decoration.objects[selected].scale||1;}draw();}
function exteriorPreview(){const c=$('exteriorPreview').getContext('2d');c.clearRect(0,0,400,380);const style=$('style').value==='shop'?'bakery':$('style').value,roof=$('roof').value;const a=assets['wwhd_'+style+(roof==='original'?'':'_roof_'+roof)],im=a&&images[a.src];if(im)WhisperwindAssets.draw(c,im,a,{x:200,y:365,scale:Math.min(360/a.displaySize.w,345/a.displaySize.h)});}
function draw(){if(!decoration)return;const c=$('room').getContext('2d');c.clearRect(0,0,1200,900);c.fillStyle={cream:'#b9a98a',sage:'#6d8973',blue:'#627d94',rose:'#996e73'}[$('wall').value];c.fillRect(80,130,1040,650);c.fillStyle={oak:'#977c59',walnut:'#49382c',stone:'#7e8480'}[$('floor').value];c.fillRect(85,225,1030,550);c.strokeStyle='#b89862';c.lineWidth=8;c.strokeRect(85,225,1030,550);c.fillStyle='rgba(211,231,182,.17)';c.fillRect(470,690,260,85);c.fillStyle='#e8eecb';c.font='18px system-ui';c.textAlign='center';c.fillText('Keep entrance clear',600,810);decoration.objects.forEach((o,i)=>{const a=assets[o.asset],im=a&&images[a.src];if(!im)return;WhisperwindAssets.draw(c,im,a,{...o,rotation:(o.rotation||0)*Math.PI/180});if(i===selected){c.strokeStyle='#ffdd86';c.lineWidth=3;const m=WhisperwindAssets.metrics(im,a,o);c.strokeRect(o.x-m.w/2,o.y-m.h,m.w,m.h);}});}
function data(){return {...decoration,floor:$('floor').value,wall:$('wall').value,privacy:$('privacy').value,exterior:{style:$('style').value,accent:$('accent').value,roof:$('roof').value,sign:$('sign').value}};}
async function start(){try{if(!plot)throw Error('Select an owned home from Hometown.');const sc=await json('/api/town/home-scene/'+encodeURIComponent(plot));if(!sc.home.canEdit)throw Error('Only the owner can decorate this home.');decoration=structuredClone(sc.home.decoration);$('return').href='/games/world.html?scene=home__'+encodeURIComponent(plot);for(const id of ['floor','wall','privacy'])$(id).value=decoration[id];for(const id of ['style','accent','sign','roof'])$(id).value=decoration.exterior[id]||(id==='roof'?'original':'');const cat=await json('/assets/worlds/world_asset_catalog.json');cat.assets.forEach(a=>assets[a.id]=a);await Promise.all([...new Set([...Object.keys(labels).map(id=>assets[id]?.src),...Object.values(assets).filter(a=>a.id.includes('_roof_')||['wwhd_cottage','wwhd_apartment','wwhd_bakery'].includes(a.id)).map(a=>a.src)].filter(Boolean))].map(src=>new Promise(resolve=>{const im=new Image();im.onload=()=>{images[src]=im;resolve();};im.onerror=resolve;im.src=src;})));Object.entries(labels).forEach(([id,name])=>{const b=document.createElement('button');b.textContent='+ '+name;b.onclick=()=>{if(decoration.objects.length>=80){$('status').textContent='The room supports up to 80 furnishings.';return;}decoration.objects.push({asset:id,x:350+(decoration.objects.length%4)*140,y:400,scale:1,rotation:0});selected=decoration.objects.length-1;list();};$('palette').append(b);});list();exteriorPreview();$('homeKind').textContent=({cottage:'Cozy cottage',family:'Family home',apartment:'Apartment',orchard:'Larger garden home'}[sc.home.homeKind]||'Your home');$('status').textContent='Your home is ready to decorate.';}catch(e){$('status').textContent=e.message;$('save').disabled=true;}}
$('save').onclick=async()=>{try{$('save').disabled=true;await json('/api/town/homes/'+encodeURIComponent(plot)+'/decorate',{decoration:data()});$('status').textContent='Saved. Your room and exterior will be here when you return.';}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
$('placed').onchange=()=>{selected=Number($('placed').value);list();};$('remove').onclick=()=>{if(selected>=0){decoration.objects.splice(selected,1);selected=-1;list();}};
for(const id of ['rotation','scale'])$(id).oninput=()=>{if(selected>=0){decoration.objects[selected][id]=Number($(id).value);draw();}};for(const id of ['floor','wall'])$(id).onchange=draw;for(const id of ['style','roof'])$(id).onchange=exteriorPreview;
function point(e){const r=$('room').getBoundingClientRect();return {x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*900/r.height};}
$('room').onpointerdown=e=>{if(!decoration)return;const p=point(e);selected=-1;for(let i=decoration.objects.length-1;i>=0;i--){const o=decoration.objects[i],a=assets[o.asset],im=a&&images[a.src];if(!im)continue;const m=WhisperwindAssets.metrics(im,a,o);if(p.x>=o.x-m.w/2&&p.x<=o.x+m.w/2&&p.y>=o.y-m.h&&p.y<=o.y){selected=i;drag={dx:p.x-o.x,dy:p.y-o.y};$('room').setPointerCapture(e.pointerId);break;}}list();};
$('room').onpointermove=e=>{if(!drag||selected<0)return;const p=point(e),o=decoration.objects[selected];const x=Math.max(140,Math.min(1060,Math.round(p.x-drag.dx))),y=Math.max(240,Math.min(760,Math.round(p.y-drag.dy)));if(y>690&&x>470&&x<730)return;o.x=x;o.y=y;draw();};$('room').onpointerup=()=>drag=null;$('room').onpointercancel=()=>drag=null;
start();
</script></body></html>
