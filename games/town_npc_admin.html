<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Town Residents</title><style>body{margin:0;background:#12251c;color:#fff0cf;font:16px system-ui}main{max-width:850px;margin:35px auto;padding:24px}h1{font:32px Georgia}label{display:block;margin:18px 0}select,button,a{font:inherit;padding:12px;border:1px solid #968862;border-radius:8px;background:#294838;color:#fff0cf}select{width:100%}.previews{display:flex;gap:15px;flex-wrap:wrap}canvas{background:#1b3327;border-radius:12px}#status{min-height:40px}a{text-decoration:none}</style></head><body><main><h1>Town Residents</h1><p>Change a resident’s appearance while keeping their name, story, and walking routine. Your choices survive server restarts and deployments.</p><label>Town scene<select id="scene"></select></label><label>Resident<select id="npc"></select></label><label>Appearance<select id="skin"></select></label><div class="previews" id="previews"></div><p><button id="save">Save Appearance</button> <a href="/games/world_composer.html">World Composer</a> <a href="/games/world.html?scene=whisperwind_hd_waterfront">Visit Hometown</a></p><p id="status" role="status"></p></main><script src="/games/js/whisperwind_assets.js"></script><script>
const $=id=>document.getElementById(id);let skins,scene;
async function json(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Could not complete action.');return d;}
function options(el,entries){el.replaceChildren();for(const [id,name]of entries){const op=document.createElement('option');op.value=id;op.textContent=name;el.append(op);}}
async function loadScene(){scene=await json('/assets/worlds/'+$('scene').value+'.json');options($('npc'),(scene.npcs||[]).map(n=>[n.id,n.name]));chooseNpc();}
function chooseNpc(){const n=scene.npcs?.find(n=>n.id===$('npc').value);$('save').disabled=!n;if(n)$('skin').value=skins.overrides?.[scene.id+':'+n.id]||n.skinId;preview();}
function preview(){const skin=skins.skins[$('skin').value];$('previews').replaceChildren();if(!skin)return;const im=new Image();im.onload=()=>{for(const face of ['down','left','right','up']){const c=document.createElement('canvas');c.width=150;c.height=190;c.setAttribute('aria-label',face+' appearance preview');const ctx=c.getContext('2d'),r=skin.frames[face][1];WhisperwindAssets.draw(ctx,im,{sourceRect:r,displaySize:{w:140*r.w/r.h,h:140},placeOrigin:{x:.5,y:1}},{x:75,y:155});ctx.fillStyle='#f4e3b3';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText(face,75,180);$('previews').append(c);}};im.src=skin.src;}
$('scene').onchange=()=>loadScene().catch(e=>$('status').textContent=e.message);$('npc').onchange=chooseNpc;$('skin').onchange=preview;$('save').onclick=async()=>{try{$('save').disabled=true;await json('/api/town/admin/npc-skin',{sceneId:$('scene').value,npcId:$('npc').value,skinId:$('skin').value});skins.overrides=skins.overrides||{};skins.overrides[scene.id+':'+$('npc').value]=$('skin').value;$('status').textContent='Appearance saved. Reload the town to see it.';}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
(async()=>{try{skins=await json('/api/town/npc-skins');options($('skin'),Object.entries(skins.skins).map(([id,s])=>[id,s.name]));const registry=await json('/assets/worlds/world_scenes.json');options($('scene'),registry.scenes.filter(s=>s.id.startsWith('whisperwind_hd_')).map(s=>[s.id,s.name]));await loadScene();}catch(e){$('status').textContent=e.message;}})();
</script></body></html>
